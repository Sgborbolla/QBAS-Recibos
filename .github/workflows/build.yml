name: Compilar QBAS-Recibos

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  windows:
    name: Ejecutable Windows (.exe)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar Neutralino CLI
        run: npm install -g @neutralinojs/neu

      - name: Preparar recursos y binarios
        run: neu update

      - name: Compilar
        run: neu build --release

      - name: Renombrar ejecutable
        run: |
          ls -la dist
          SRC=$(ls dist/*win*.exe 2>/dev/null | head -1)
          cp "$SRC" "QBAS-Recibos.exe"

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: QBAS-Recibos-Windows
          path: QBAS-Recibos.exe

  android:
    name: APK Android (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar paquetes del SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Instalar dependencias
        run: npm install

      - name: Crear y sincronizar proyecto Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Firmar APK
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/qbas.keystore" \
            -alias qbas \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass qbas12345 -keypass qbas12345 \
            -dname "CN=QBASWING, O=QBASWING, C=CU"
          "$BT/zipalign" -v -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/qbas.keystore" \
            --ks-pass pass:qbas12345 \
            --key-pass pass:qbas12345 \
            --out "QBAS-Recibos.apk" \
            "$RUNNER_TEMP/aligned.apk"

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: QBAS-Recibos-Android
          path: QBAS-Recibos.apk
