name: Compilar QBAS-Recibos

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  windows:
    name: Ejecutable Windows (.exe)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar Neutralino CLI
        run: npm install -g @neutralinojs/neu

      - name: Preparar recursos y binarios
        run: neu update

      - name: Compilar
        run: neu build --release

      - name: Preparar ejecutable
        run: |
          set -e
          find dist -maxdepth 3 -type f | sort
          mkdir -p out
          EXE=$(find dist -iname "*win*.exe" | head -1)
          echo "EXE=$EXE"
          cp "$EXE" out/QBAS-Recibos.exe
          (cd dist && zip -rq ../QBAS-Recibos-Windows.zip .)

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: QBAS-Recibos-Windows
          path: |
            out/QBAS-Recibos.exe
            QBAS-Recibos-Windows.zip

  android:
    name: APK Android (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Android SDK
        run: |
          set -e
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -sSLo /tmp/tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/tools.zip -d "$SDK_ROOT/cmdline-tools"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
          export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Instalar dependencias
        run: npm install

      - name: Crear y sincronizar proyecto Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Aplicar icono de la app
        continue-on-error: true
        run: |
          set -e
          RES=android/app/src/main/res
          declare -A SIZES=( [mdpi]=48 [hdpi]=72 [xhdpi]=96 [xxhdpi]=144 [xxxhdpi]=192 )
          for d in "${!SIZES[@]}"; do
            s=${SIZES[$d]}
            convert -background none src/img/qbas-icon.png -resize ${s}x${s} "$RES/mipmap-$d/ic_launcher.png"
            convert -background none src/img/qbas-icon.png -resize ${s}x${s} "$RES/mipmap-$d/ic_launcher_round.png"
            big=$((s*2))
            convert -background none src/img/qbas-icon.png -resize ${s}x${s} \
              -gravity center -background none -extent ${big}x${big} "$RES/mipmap-$d/ic_launcher_foreground.png"
          done

      - name: Crear keystore para Play Store
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/qbas-upload.keystore" \
            -alias qbasupload \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass qbas12345 -keypass qbas12345 \
            -dname "CN=QBASWING DESIGNER, O=QBASWING DESIGNER, C=CU"

      - name: Compilar APK y AAB firmados
        run: |
          set -e
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/qbas-upload.keystore" \
            -Pandroid.injected.signing.store.password=qbas12345 \
            -Pandroid.injected.signing.key.alias=qbasupload \
            -Pandroid.injected.signing.key.password=qbas12345

      - name: Preparar artefactos
        run: |
          set -e
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          AAB=$(find android/app/build/outputs/bundle/release -name "*.aab" | head -1)
          echo "APK=$APK"
          echo "AAB=$AAB"
          cp "$APK" QBAS-Recibos.apk
          cp "$AAB" QBAS-Recibos.aab
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs QBAS-Recibos.apk || true

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: QBAS-Recibos-Android
          path: |
            QBAS-Recibos.apk
            QBAS-Recibos.aab
